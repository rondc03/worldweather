services:
  eureka-server:
    image: springcloud/eureka
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worldweather:
    build: .
    image: worldweather:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      EUREKA_SERVER_URI: ${EUREKA_SERVER_URI:-http://localhost:8761}
      CONFIG_SERVER_ENABLED: ${CONFIG_SERVER_ENABLED:-true}
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://config-server:8888}
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-change-me}
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 1m
